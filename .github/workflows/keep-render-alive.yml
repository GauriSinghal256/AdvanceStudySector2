name: Keep Render service awake

on:
  schedule:
    # Runs every 10 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "::error::RENDER_URL secret is not configured in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Strip trailing slash and ensure /ping endpoint
          TARGET_URL="${RENDER_URL%/}"
          if [[ "$TARGET_URL" != *"/ping" && "$TARGET_URL" != *"/api"* ]]; then
            TARGET_URL="${TARGET_URL}/ping"
          fi

          echo "Pinging: $TARGET_URL"
          RESPONSE=$(curl -s -w "\n%{http_code}\n%{time_total}" --max-time 60 "$TARGET_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 2 | head -n 1)
          TOTAL_TIME=$(echo "$RESPONSE" | tail -n 1)

          echo "Response code: $HTTP_CODE"
          echo "Total time: ${TOTAL_TIME}s"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "✅ Render service is alive!"
          else
            echo "⚠️ Render service returned code $HTTP_CODE"
          fi
